<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Arenamon VFX Composer</title><style>/*__STYLE__*/</style></head><body><main class="app"><header class="top"><div class="brand">Arenamon VFX Composer<small>F3.1 · partículas determinísticas, orçamento e telemetria</small></div><div class="toolbar"><button id="add-box">+ Cubo</button><button id="add-sphere">+ Esfera</button><button id="add-plane">+ Plano</button><button id="add-stroke">+ Stroke</button><button id="add-curve">+ Curva</button><button id="add-ribbon">+ Ribbon</button></div><div class="toolbar"><button id="draw-stroke">✎ Desenhar</button><button id="finish-drawing" disabled>✓ Finalizar</button><button id="cancel-drawing" disabled>Cancelar</button><button id="undo">↶ Undo</button><button id="redo">↷ Redo</button><a href="../../../ABRIR_ARENAMON.html"><button>Portal</button></a></div></header><aside class="panel left"><div class="panel-head"><h2>Hierarquia</h2><button id="toggle-left-panel">◀</button></div><div id="hierarchy"></div></aside><section id="viewport" aria-label="Viewport 3D"><nav class="view-tools"><button id="view-perspective">Perspectiva</button><button id="view-front">Frontal</button><button id="view-side">Lateral</button></nav></section><aside class="panel right"><div class="panel-head"><h2>Propriedades</h2><button id="toggle-right-panel">▶</button></div><div id="selection">Nenhum objeto selecionado</div><div class="inline-actions"><button id="toggle-lock">🔓 Travar</button><button id="toggle-isolate">Isolar</button><label>Gizmo <select id="gizmo-space"><option value="world">Global</option><option value="local">Local</option></select></label></div><h2>Posição</h2><label class="field">X<input id="position-x" type="number" step="0.1"><span class="unit">m</span></label><label class="field">Y<input id="position-y" type="number" step="0.1"><span class="unit">m</span></label><label class="field">Z<input id="position-z" type="number" step="0.1"><span class="unit">m</span></label><h2>Pivô local</h2><label class="field">X<input id="pivot-x" type="number" step="0.01"><span class="unit">m</span></label><label class="field">Y<input id="pivot-y" type="number" step="0.01"><span class="unit">m</span></label><label class="field">Z<input id="pivot-z" type="number" step="0.01"><span class="unit">m</span></label><button id="apply-pivot">Aplicar pivô</button><h2>Desenho e caminhos</h2><label class="field wide">Alvo<select id="drawing-target"><option value="plane">Plano orientável</option><option value="surface">Superfície 3D</option></select><span></span></label><label class="paired"><span>Largura</span><input id="path-width-range" type="range" min="0.01" max="2" step="0.01" value="0.14"><input id="path-width" type="number" min="0.01" max="10" step="0.01" value="0.14"><span class="unit">m</span></label><label class="paired"><span>Taper final</span><input id="path-end-width-range" type="range" min="0.01" max="2" step="0.01" value="0.14"><input id="path-end-width" type="number" min="0.01" max="10" step="0.01" value="0.14"><span class="unit">m</span></label><label class="paired"><span>Snap</span><input id="path-snap-range" type="range" min="0.01" max="10" step="0.01" value="0.25"><input id="path-snap" type="number" min="0.01" max="50" step="0.01" value="0.25"><span class="unit">m</span></label><label class="paired"><span>Extrusão</span><input id="path-extrusion-range" type="range" min="0.01" max="2" step="0.01" value="0.04"><input id="path-extrusion" type="number" min="0.01" max="10" step="0.01" value="0.04"><span class="unit">m</span></label><div class="inline-actions"><button id="apply-taper">Aplicar taper</button><button id="apply-extrusion">Aplicar extrusão</button></div><h2>Plano orientável</h2><div class="axis-grid"><label>Origem X<input id="plane-origin-x" type="number" min="-50" max="50" step="0.1" value="0"></label><label>Y<input id="plane-origin-y" type="number" min="-50" max="50" step="0.1" value="0"></label><label>Z<input id="plane-origin-z" type="number" min="-50" max="50" step="0.1" value="0"></label></div><div class="axis-grid"><label>Rotação X<input id="plane-rotation-x" type="number" min="-900" max="900" step="1" value="0"></label><label>Y<input id="plane-rotation-y" type="number" min="-900" max="900" step="1" value="0"></label><label>Z<input id="plane-rotation-z" type="number" min="-900" max="900" step="1" value="0"></label></div><label><input id="mirror-x" type="checkbox"> Simetria no eixo local X</label><label class="paired"><span>Repetição</span><input id="radial-copies-range" type="range" min="1" max="12" step="1" value="1"><input id="radial-copies" type="number" min="1" max="12" step="1" value="1"><span class="unit">×</span></label><section id="vertex-editor"><h2>Vértice do caminho</h2><label class="field wide">Índice<select id="vertex-index"></select><span class="unit">#</span></label><label class="field">X<input id="vertex-x" type="number" step="0.01"><span class="unit">m</span></label><label class="field">Y<input id="vertex-y" type="number" step="0.01"><span class="unit">m</span></label><label class="field">Z<input id="vertex-z" type="number" step="0.01"><span class="unit">m</span></label><div class="inline-actions"><button id="apply-vertex">Aplicar</button><button id="insert-vertex">+ Ponto</button><button id="remove-vertex">− Ponto</button></div></section><section><h2>Arquivo do projeto</h2><label><input id="use-file-system" type="checkbox"> Usar seletor de arquivo quando disponível</label><div class="inline-actions"><label class="file-button">Importar JSON<input id="import-project" type="file" accept="application/json,.json" hidden></label><button id="export-project">Exportar JSON</button></div></section><p id="status"></p></aside></main><script>/*__SCRIPT__*/</script></body></html>
