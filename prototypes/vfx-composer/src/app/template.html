<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Arenamon VFX Composer</title><style>/*__STYLE__*/</style></head><body><main class="app"><header class="top"><div class="brand">Arenamon VFX Composer<small>F1 · autoria geométrica offline</small></div><button id="add-box">+ Cubo</button><button id="add-stroke">+ Stroke</button><button id="add-curve">+ Curva</button><button id="add-ribbon">+ Ribbon</button><button id="draw-stroke">✎ Desenhar</button><button id="finish-drawing" disabled>✓ Finalizar</button><button id="cancel-drawing" disabled>Cancelar</button><button id="undo" title="Desfazer">↶ Undo</button><button id="redo" title="Refazer">↷ Redo</button><a href="../../../ABRIR_ARENAMON.html"><button>Portal</button></a></header><aside class="panel left"><h2>Hierarquia</h2><div id="hierarchy"></div></aside><section id="viewport" aria-label="Viewport 3D"></section><aside class="panel right"><h2>Propriedades</h2><div id="selection">Nenhum objeto selecionado</div><h2>Posição</h2><label class="field">X<input id="position-x" type="number" step="0.1"><span class="unit">m</span></label><label class="field">Y<input id="position-y" type="number" step="0.1"><span class="unit">m</span></label><label class="field">Z<input id="position-z" type="number" step="0.1"><span class="unit">m</span></label><h2>Pivô local</h2><label class="field">X<input id="pivot-x" type="number" step="0.01"><span class="unit">m</span></label><label class="field">Y<input id="pivot-y" type="number" step="0.01"><span class="unit">m</span></label><label class="field">Z<input id="pivot-z" type="number" step="0.01"><span class="unit">m</span></label><button id="apply-pivot">Aplicar pivô</button><h2>Novos caminhos</h2><label class="field wide">Alvo<select id="drawing-target"><option value="plane">Plano XZ</option><option value="surface">Superfície 3D</option></select><span class="unit"></span></label><label class="field wide">Largura<input id="path-width" type="number" min="0.01" max="2" step="0.01" value="0.14"><span class="unit">m</span></label><label class="field wide">Snap<input id="path-snap" type="number" min="0.01" max="10" step="0.01" value="0.25"><span class="unit">m</span></label><label class="field wide">Extrusão<input id="path-extrusion" type="number" min="0.01" max="2" step="0.01" value="0.04"><span class="unit">m</span></label><button id="apply-extrusion">Aplicar à Ribbon</button><section id="vertex-editor"><h2>Vértice do caminho</h2><label class="field wide">Índice<select id="vertex-index"></select><span class="unit">#</span></label><label class="field">X<input id="vertex-x" type="number" step="0.01"><span class="unit">m</span></label><label class="field">Y<input id="vertex-y" type="number" step="0.01"><span class="unit">m</span></label><label class="field">Z<input id="vertex-z" type="number" step="0.01"><span class="unit">m</span></label><div class="vertex-actions"><button id="apply-vertex">Aplicar</button><button id="insert-vertex">+ Ponto</button><button id="remove-vertex">− Ponto</button></div></section><section><h2>Arquivo do projeto</h2><label><input id="use-file-system" type="checkbox"> Usar seletor de arquivo quando disponível</label><div class="vertex-actions"><label class="file-button">Importar JSON<input id="import-project" type="file" accept="application/json,.json" hidden></label><button id="export-project">Exportar JSON</button></div></section><p id="status"></p></aside></main><script>/*__SCRIPT__*/</script></body></html>
