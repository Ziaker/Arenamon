<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>9 opções e contatos · Quarks</title><style>body{background:#161d28;color:#eee;font:16px system-ui;max-width:1200px;margin:35px auto}a{color:#9beaff}img{width:100%;border:1px solid #506070}figure{margin:30px 0}figcaption{padding:12px}</style><a href="../../../../ABRIR_ARENAMON.html">← Portal</a><h1>Três opções por efeito · contatos</h1><p>Capturas offline no Edge: água com ponta e stretch, vórtice de centro aberto e cortes brancos de vento.</p><a href="variants-results.json">Resultados dos testes das nove opções</a><div id="gallery"></div><script>const gallery=document.querySelector('#gallery');for(const [move,label] of [['waterPulse','Água'],['fireSpin','Fogo'],['airSlash','Vento']])for(let i=0;i<3;i++)for(const phase of move==='fireSpin'?['option']:['option','contact']){const title=label+' · '+['A','B','C'][i]+' · '+(phase==='contact'?'Contato':'Efeito');const fig=document.createElement('figure');fig.innerHTML='<img loading="lazy" src="'+move+'-'+phase+'-'+i+'.png" alt="'+title+'"><figcaption>'+title+'</figcaption>';gallery.append(fig);}</script><a href="step-0-charge.png">Diagnóstico original do adaptador: preset corrigido</a></html>
