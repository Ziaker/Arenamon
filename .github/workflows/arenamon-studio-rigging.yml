name: Arenamon Studio Rigging

on:
  push:
    branches:
      - 'feat/studio-rigging*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rigging:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build offline Studio
        run: node prototypes/studio/build.mjs
      - name: Rigging unit tests
        run: node prototypes/studio/test/rigging.test.mjs
      - name: Rigging browser integration test
        run: node prototypes/studio/test/rigging.browser.mjs
      - name: Studio existing unit tests
        run: node prototypes/studio/test/ops.test.mjs
      - name: Studio existing browser regressions
        run: node prototypes/studio/verify.mjs
      - name: Upload HTML and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arenamon-studio-rigging
          path: |
            prototypes/studio/dist/arenamon-animation-studio.html
            prototypes/studio/validation/
          retention-days: 14
          if-no-files-found: warn
