name: Arenamon Studio Rigging

on:
  push:
    branches:
      - feat/studio-rigging-fase1-gpt6
      - codex/rig-editor-*
  pull_request:
    paths:
      - '.github/workflows/arenamon-studio-rigging.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'prototypes/studio/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rigging:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Runtime versions
        run: |
          node --version
          npm --version
      - name: Repository verification
        run: npm run verify
      - name: Upload HTML and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arenamon-studio-rigging
          path: |
            prototypes/studio/dist/arenamon-animation-studio.html
            prototypes/studio/validation/
          retention-days: 14
          if-no-files-found: warn
