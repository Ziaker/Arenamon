name: Studio CI render probe

# Experimento A/B no executor real (sem GPU): etapa de layout do verify no modo completo forçado x modo leve automático.
on:
  # Só manual: reproduz as medições do relatório RELATORIO_CI_E_INTEGRACAO_DIAGNOSTICO.md.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node prototypes/studio/build.mjs
      - name: A - modo completo forcado (comportamento anterior), ate o layout
        env:
          STUDIO_VERIFY_UNTIL: 'layout:'
          STUDIO_VERIFY_SLOW_MS: '1000'
          STUDIO_VERIFY_QUERY: '?gl=full'
        run: node prototypes/studio/verify.mjs
      - name: D - deteccao automatica (sem GPU = modo leve), ate o layout
        env:
          STUDIO_VERIFY_UNTIL: 'layout:'
          STUDIO_VERIFY_SLOW_MS: '1000'
        run: node prototypes/studio/verify.mjs
