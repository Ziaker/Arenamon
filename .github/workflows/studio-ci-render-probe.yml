name: Studio CI render probe

# Experimento A/B no executor real (sem GPU): mesma etapa de layout do verify com e sem backdrop-filter.
on:
  push:
    branches:
      - fix/studio-diagnostic-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node prototypes/studio/build.mjs
      - name: A - CSS original, operacoes lentas e quadros
        env:
          STUDIO_VERIFY_UNTIL: 'layout:'
          STUDIO_VERIFY_SLOW_MS: '1000'
        run: node prototypes/studio/verify.mjs
      - name: C - canvas WebGL fora da composicao (visibility hidden)
        env:
          STUDIO_VERIFY_UNTIL: 'layout:'
          STUDIO_VERIFY_SLOW_MS: '1000'
          STUDIO_VERIFY_CSS: '#view canvas{visibility:hidden!important}'
        run: node prototypes/studio/verify.mjs
