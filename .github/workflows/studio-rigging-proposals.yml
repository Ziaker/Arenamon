name: Arenamon Studio Rigging Proposals

on:
  push:
    branches:
      - feat/studio-rigging-ui-proposals
      - 'integration/**'
  pull_request:
    branches:
      - feat/studio-rigging-ui-proposals
      - 'integration/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proposals:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build proposals
        run: node prototypes/studio/proposals/build.mjs
      - name: Configure Edge for CI software rendering
        shell: pwsh
        run: |
          $edgeDir = "C:\Program Files (x86)\Microsoft\Edge\Application"
          if (Test-Path "$edgeDir\msedge.exe") {
            if (-not (Test-Path "$edgeDir\msedge_orig.exe")) {
              Stop-Process -Name msedge -Force -ErrorAction SilentlyContinue
              Move-Item "$edgeDir\msedge.exe" "$edgeDir\msedge_orig.exe" -Force
              $code = @'
              using System;
              using System.Diagnostics;
              class Program {
                  static int Main(string[] args) {
                      var psi = new ProcessStartInfo();
                      psi.FileName = @"C:\Program Files (x86)\Microsoft\Edge\Application\msedge_orig.exe";
                      psi.UseShellExecute = false;
                      psi.Arguments = "--use-angle=swiftshader --disable-gpu-sandbox --no-sandbox";
                      foreach (var a in args) {
                          if (a.Contains(" ") || a.Contains("\"")) {
                              psi.Arguments += " \"" + a.Replace("\"", "\\\"") + "\"";
                          } else {
                              psi.Arguments += " " + a;
                          }
                      }
                      var p = Process.Start(psi);
                      p.WaitForExit();
                      return p.ExitCode;
                  }
              }
              '@
              Add-Type -TypeDefinition $code -OutputAssembly "$edgeDir\msedge.exe" -OutputType ConsoleApplication
              Write-Host "Edge wrapper configured with SwiftShader"
            }
          }
      - name: Run cross-validation with Codex core 7323b48
        run: node prototypes/studio/proposals/test-codex-cross.mjs
      - name: Run proposal automated tests
        run: node prototypes/studio/proposals/test-proposals.mjs
      - name: Verify repository status
        run: |
          Stop-Process -Name msedge,chrome,chromium -Force -ErrorAction SilentlyContinue
          npm run verify
      - name: Upload proposal artifacts and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arenamon-rigging-proposals
          path: |
            prototypes/studio/proposals/dist/
            prototypes/studio/proposals/screenshots/
          retention-days: 14
          if-no-files-found: warn
